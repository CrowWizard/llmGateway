name: Windows Build

on:
  push:
    branches:
      - dev
      - main
      - ailili-main
  pull_request:
    branches:
      - dev
      - main
      - ailili-main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore gateway, desktop and tests
        shell: pwsh
        run: |
          dotnet restore LlmGateway.csproj --runtime win-x64
          dotnet restore LlmGateway.Desktop/LlmGateway.Desktop.csproj --runtime win-x64
          dotnet restore LlmGateway.Tests/LlmGateway.Tests.csproj --runtime win-x64

      - name: Test
        run: dotnet test LlmGateway.Tests/LlmGateway.Tests.csproj --no-restore --configuration Release

      - name: Publish gateway and desktop applications
        shell: pwsh
        run: |
          $output = Join-Path $env:GITHUB_WORKSPACE "artifacts/win-x64"
          dotnet publish LlmGateway.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false --output $output
          dotnet publish LlmGateway.Desktop/LlmGateway.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false --output $output

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: LlmGateway-win-x64
          path: artifacts/win-x64
          if-no-files-found: error
          retention-days: 14
